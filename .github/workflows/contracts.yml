name: Contracts

# THE FULL SWEEP, OFF THE DEVELOPER'S MACHINE (CLAUDE.md, "TESTING AND
# RELEASING"). Every push runs all of tests/*.mjs, split across parallel
# runners by tools/contracts.mjs (balanced on tools/contract-times.json),
# each judged by its exit code, a failure rerun once alone before it counts.
# Main is fast-forwarded only once this run is green on the branch. Docs-only
# pushes skip it, and so does a push to main: main only ever moves by
# fast-forward to a commit whose branch run was green — the same tree, tested
# — so running it again there was the whole sweep twice for every release (a
# hand-started run can still judge main).
#
# THE SMOOTHNESS GATE (tools/perf-gate.mjs, CLAUDE.md "THE SMOOTHNESS GATE")
# runs beside the shards on four runners of its own: each plays the candidate
# and the reference build (tools/perf-reference.json) on a simulated slow
# phone, interleaved, and the verdict job holds the run red when the candidate
# plays worse. A red verdict is a red run: the release waits.

on:
  push:
    branches-ignore: ['main']
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Smoothness gate: the build to judge (a commit or branch; empty = this ref)'
        required: false
        default: ''
      reference:
        description: 'Smoothness gate: the build to judge it against (empty = tools/perf-reference.json)'
        required: false
        default: ''
      only_smoothness:
        description: 'Run only the smoothness gate (skip the contract shards)'
        type: boolean
        default: false

permissions:
  contents: read

# a push supersedes the last push's run; a hand-started run (a smoothness
# check of two named builds) never cancels one, nor is cancelled by one
concurrency:
  group: contracts-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts ${{ matrix.shard }}/8
    if: ${{ !inputs.only_smoothness }}
    runs-on: ubuntu-24.04   # pinned: Playwright 1.56.1 cannot install Chromium on ubuntu-latest (26.04)
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the same Playwright the sandbox ships, and its Chromium
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-${{ runner.os }}
      # THE FONTS COME FROM THE CACHE TOO. --with-deps installs nine font
      # packages this runner image lacks (everything else on Playwright's list
      # is already here) from whichever Ubuntu mirror the runner draws, and
      # some draw one at kilobytes a second: in most runs one job spent 70-340 s
      # on setup while the others took 30, and the whole run waited for it.
      # Cached, the same packages install offline with dpkg; anything
      # Playwright still finds missing takes the old road, which fills the cache.
      - uses: actions/cache@v4
        with:
          path: ~/pw-fonts
          key: playwright-fonts-1.56.1-${{ runner.os }}
      - name: Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          sudo rm -f /var/lib/man-db/auto-update
          if compgen -G "$HOME/pw-fonts/*.deb" > /dev/null; then
            sudo dpkg -i --refuse-downgrade --skip-same-version "$HOME"/pw-fonts/*.deb > /dev/null || true
          fi
          missing=$(node -e '
            try {
              const pc = "./node_modules/playwright-core/lib/server/";
              const p = require(pc + "registry/nativeDeps.js").deps[require(pc + "utils/hostPlatform.js").hostPlatform];
              const { execFileSync } = require("child_process");
              for (const k of [...p.tools, ...p.chromium]) {
                let s = ""; try { s = execFileSync("dpkg-query", ["-W", "-f=${Status}", k], { encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] }); } catch (e) {}
                if (!/ ok installed$/.test(s)) console.log(k);
              }
            } catch (e) { console.log("?"); }')
          if [ -n "$missing" ]; then
            echo "Installing system packages:" $missing
            # keep what apt downloads, so the fonts can be cached for next time
            sudo rm -f /etc/apt/apt.conf.d/docker-clean
            echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-debs > /dev/null
            npx playwright install --with-deps chromium
            debs=$(ls /var/cache/apt/archives/fonts-*.deb /var/cache/apt/archives/xfonts-*.deb 2>/dev/null || true)
            if [ -n "$debs" ]; then mkdir -p ~/pw-fonts && cp $debs ~/pw-fonts/; fi
          else
            echo "Every system package Playwright needs is installed"
            npx playwright install chromium
          fi
      # tests/analytics.mjs starts its own PostgreSQL (initdb / pg_ctl)
      - name: PostgreSQL binaries
        run: ls /usr/lib/postgresql/*/bin/initdb || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql)
      - name: Shard ${{ matrix.shard }} of 8
        run: node tools/contracts.mjs shard ${{ matrix.shard }} 8 --lanes 2 --logs contract-logs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-logs-${{ matrix.shard }}
          path: contract-logs
          retention-days: 7

  # each runner plays one session of each build, half of them the reference
  # first; main itself is not re-judged (its branch run already was)
  smoothness:
    name: Smoothness ${{ matrix.runner }}/4
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name != 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: 1, order: rc }
          - { runner: 2, order: cr }
          - { runner: 3, order: rc }
          - { runner: 4, order: cr }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-${{ runner.os }}
      # THE FONTS COME FROM THE CACHE TOO. --with-deps installs nine font
      # packages this runner image lacks (everything else on Playwright's list
      # is already here) from whichever Ubuntu mirror the runner draws, and
      # some draw one at kilobytes a second: in most runs one job spent 70-340 s
      # on setup while the others took 30, and the whole run waited for it.
      # Cached, the same packages install offline with dpkg; anything
      # Playwright still finds missing takes the old road, which fills the cache.
      - uses: actions/cache@v4
        with:
          path: ~/pw-fonts
          key: playwright-fonts-1.56.1-${{ runner.os }}
      - name: Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          sudo rm -f /var/lib/man-db/auto-update
          if compgen -G "$HOME/pw-fonts/*.deb" > /dev/null; then
            sudo dpkg -i --refuse-downgrade --skip-same-version "$HOME"/pw-fonts/*.deb > /dev/null || true
          fi
          missing=$(node -e '
            try {
              const pc = "./node_modules/playwright-core/lib/server/";
              const p = require(pc + "registry/nativeDeps.js").deps[require(pc + "utils/hostPlatform.js").hostPlatform];
              const { execFileSync } = require("child_process");
              for (const k of [...p.tools, ...p.chromium]) {
                let s = ""; try { s = execFileSync("dpkg-query", ["-W", "-f=${Status}", k], { encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] }); } catch (e) {}
                if (!/ ok installed$/.test(s)) console.log(k);
              }
            } catch (e) { console.log("?"); }')
          if [ -n "$missing" ]; then
            echo "Installing system packages:" $missing
            # keep what apt downloads, so the fonts can be cached for next time
            sudo rm -f /etc/apt/apt.conf.d/docker-clean
            echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-debs > /dev/null
            npx playwright install --with-deps chromium
            debs=$(ls /var/cache/apt/archives/fonts-*.deb /var/cache/apt/archives/xfonts-*.deb 2>/dev/null || true)
            if [ -n "$debs" ]; then mkdir -p ~/pw-fonts && cp $debs ~/pw-fonts/; fi
          else
            echo "Every system package Playwright needs is installed"
            npx playwright install chromium
          fi
      - name: Play the candidate and the reference
        env:
          CAND: ${{ inputs.candidate }}
          REF: ${{ inputs.reference }}
        run: |
          node tools/perf-gate.mjs measure --runner runner-${{ matrix.runner }} --order ${{ matrix.order }} \
            --out perf-${{ matrix.runner }}.json ${CAND:+--cand "$CAND"} ${REF:+--ref "$REF"}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ matrix.runner }}
          path: perf-${{ matrix.runner }}.json
          retention-days: 14

  smoothness-verdict:
    name: Smoothness verdict
    needs: smoothness
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.ref_name != 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: perf-*
          merge-multiple: true
      - name: The verdict
        run: node tools/perf-gate.mjs judge perf-*.json --min-runners 3
